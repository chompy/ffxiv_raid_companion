name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Publish dist/ as the entire gh-pages branch. No third-party deploy
      # action: a fresh orphan commit force-pushed each time keeps it simple.
      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TMP=$(mktemp -d)
          cp -r dist/. "$TMP/site"
          git -C "$TMP/site" init -b gh-pages
          git -C "$TMP/site" config user.name "github-actions[bot]"
          git -C "$TMP/site" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TMP/site" add -A
          git -C "$TMP/site" commit -m "Publish ${GITHUB_SHA:0:7}"
          git -C "$TMP/site" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git -C "$TMP/site" push --force origin gh-pages
