<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FFXIV Raid Companion</title>
<style>
  :root {
    --bg: #14151d;
    --panel: #1e202b;
    --panel2: #262937;
    --border: #323648;
    --text: #d8dae5;
    --dim: #8a8fa3;
    --gold: #d4af37;
    --red: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--panel);
    font-size: 13px;
  }
  header h1 { font-size: 15px; color: var(--gold); letter-spacing: 1px; margin-right: 8px; }
  .status-item { color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; }
  .dot.on { background: #4caf72; }
  .dot.off { background: var(--red); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 320px 1fr 360px;
    gap: 10px;
    padding: 10px;
    min-height: 0;
  }

  /* While the timer runs, hide the builder so the mechanic image gets full width */
  body.in-run main { grid-template-columns: 320px 1fr; }
  body.in-run #builder-panel { display: none; }

  .left-col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .left-col > .panel { flex-shrink: 0; }

  /* ---- Mechanic tracker panel ---- */
  #tracker-panel { flex: 1; padding: 12px; gap: 6px; }
  #tracker-panel h2 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  .tracker-status { font-size: 11px; color: var(--dim); min-height: 14px; word-break: break-word; }
  .tracker-status.error { color: var(--red); }
  #tracker-lines { flex: 1; overflow-y: auto; display: flex; flex-direction: column; font-family: "Consolas", "Menlo", monospace; font-size: 13px; padding-top: 4px; min-height: 0; }
  .tline { min-height: 18px; line-height: 1.35; white-space: pre-wrap; word-break: break-word; border-bottom: 1px dotted #2c2f3e; padding: 1px 0; color: var(--text); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ---- Timer panel ---- */
  #timer-panel { align-items: center; justify-content: center; gap: 14px; padding: 20px; }
  #time-display {
    font-family: "Consolas", "Menlo", monospace;
    font-size: 64px;
    font-weight: bold;
    letter-spacing: 2px;
    color: var(--text);
    text-shadow: 0 0 18px rgba(212, 175, 55, 0.25);
  }
  #time-display.running { color: var(--gold); }
  #state-label { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); }
  #state-label.running { color: var(--gold); }
  #next-event { font-size: 13px; color: var(--dim); min-height: 18px; }
  #hint { font-size: 12px; color: var(--dim); text-align: center; line-height: 1.6; padding-top: 10px; border-top: 1px solid var(--border); width: 100%; }
  #toggle-btn {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 22px;
    font-size: 14px;
    cursor: pointer;
  }
  #toggle-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* ---- Image panel ---- */
  #image-panel { align-items: center; justify-content: center; position: relative; overflow: hidden; }
  #current-image { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  #no-image { color: var(--dim); font-size: 18px; letter-spacing: 2px; position: absolute; }

  /* ---- Builder panel ---- */
  #builder-panel { padding: 12px; gap: 10px; }
  #builder-panel h2 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  #add-form { display: flex; flex-direction: column; gap: 8px; }
  .form-row { display: flex; gap: 8px; align-items: center; }
  input[type="text"], input[type="number"] {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    padding: 7px 9px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--gold); }
  #time-input { width: 110px; }
  .btn {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }
  .import-hint { font-size: 11px; color: var(--dim); text-align: center; }
  #file-drop {
    flex: 1;
    min-height: 42px;
    border: 1px dashed var(--border);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    color: var(--dim);
    cursor: pointer;
    padding: 4px;
    overflow: hidden;
  }
  #file-drop.has-file { border-color: var(--gold); color: var(--text); }
  #pending-preview { max-height: 36px; max-width: 120px; object-fit: contain; display: none; }
  #form-error { font-size: 12px; color: var(--red); min-height: 14px; }
  #entry-list { list-style: none; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
  .entry {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
  }
  .entry.active { border-color: var(--gold); box-shadow: 0 0 8px rgba(212, 175, 55, 0.35); }
  .entry.next { border-color: #4a6fa5; }
  .entry img { width: 52px; height: 39px; object-fit: cover; border-radius: 3px; cursor: pointer; flex-shrink: 0; }
  .entry-time { font-family: "Consolas", monospace; font-size: 14px; cursor: pointer; min-width: 62px; color: var(--text); }
  .entry-time:hover { color: var(--gold); }
  .entry input { width: 90px !important; padding: 3px 6px !important; font-size: 13px !important; }
  .entry-del { margin-left: auto; background: none; border: none; color: var(--dim); cursor: pointer; font-size: 15px; padding: 2px 6px; }
  .entry-del:hover { color: var(--red); }
</style>
</head>
<body>

<header>
  <h1>RAID COMPANION</h1>
  <span class="status-item"><span id="gp-dot" class="dot"></span><span id="gp-status">gamepad: disconnected</span></span>
  <span class="status-item"><span id="relay-dot" class="dot"></span><span id="relay-status">relay: off</span></span>
  <span class="status-item" id="bind-status"></span>
</header>

<main>
  <div class="left-col">
    <section class="panel" id="timer-panel">
      <div id="time-display">0:00.0</div>
      <div id="state-label">Ready</div>
      <div id="next-event">&nbsp;</div>
      <button id="toggle-btn" type="button">Start / Reset</button>
    </section>

    <section class="panel" id="tracker-panel">
      <h2>Mechanic Tracker</h2>
      <div id="tracker-status"></div>
      <div id="tracker-lines"></div>
      <div id="hint"></div>
    </section>
  </div>

  <section class="panel" id="image-panel">
    <img id="current-image" alt="" hidden>
    <div id="no-image">— no active mechanic —</div>
  </section>

  <aside class="panel" id="builder-panel">
    <h2>Timeline Builder</h2>
    <form id="add-form" autocomplete="off">
      <div class="form-row">
        <input type="text" id="time-input" placeholder="mm:ss" title="Time, e.g. 1:30 or 90 or 12:05.5">
        <button class="btn" type="submit">Add</button>
      </div>
      <div class="form-row">
        <div id="file-drop" title="Click, drag an image here, or paste (Ctrl+V)">
          <img id="pending-preview" alt="">
          <span id="file-label">click / drop / paste image</span>
        </div>
      </div>
      <input type="file" id="file-input" accept="image/*" hidden>
      <div id="form-error"></div>
    </form>
    <ul id="entry-list"></ul>
    <div class="btn-row">
      <button class="btn" id="export-btn" type="button">Export</button>
      <button class="btn danger" id="clear-all" type="button">Clear all</button>
    </div>
    <div class="import-hint">Drop an exported .json timeline or a .lua tracker script anywhere on this window to load it</div>
  </aside>
</main>

</script>
<script>
"use strict";

/* ==========================================================================
 * CONFIGURATION
 * ========================================================================== */
const CONFIG = {
  // Control button (standard gamepad mapping):
  //   single press -> trigger the mechanic tracker (starts a stopped timer)
  //   double press -> reset the timer
  // Common values: 8 = Back/Select, 9 = Start/Menu. On this Linux setup the
  // Xbox Guide/Home button is exposed as index 16; on Windows it is usually
  // not visible to browsers at all (use gamepad_relay.py instead).
  RESET_BUTTON_INDEX: 16,

  // WebSocket relay for background (unfocused) gamepad input.
  // Set to "" to disable. gamepad_relay.py listens here by default.
  RELAY_WS_URL: "ws://127.0.0.1:8765",

  // Two presses of the control button within this window = reset timer.
  // A single press triggers the mechanic tracker (and starts a stopped timer).
  DOUBLE_PRESS_MS: 400,

  // Number of text lines in the mechanic tracker display.
  TRACKER_LINES: 6,

  STORAGE_KEY: "ffxiv-raid-companion-v1",

  // Images are downscaled to this width before being stored in localStorage.
  MAX_IMAGE_WIDTH: 1280,
};

const BUTTON_NAMES = { 8: "Back/Select (btn 8)", 9: "Start/Guide (btn 9)", 16: "Guide/Home (btn 16)" };

/* ==========================================================================
 * STATE
 * ========================================================================== */
const savedState = loadState();
let entries = savedState.entries;       // [{id, ms, image}] sorted by ms
let savedScript = savedState.script;    // last imported Lua tracker script (string or null)
let running = false;                    // timer state
let startedAt = 0;                      // performance.now() when started
let pendingFile = null;                 // {dataUrl, name} awaiting a time value
let previewIdx = -1, previewUntil = 0;  // temporary thumbnail preview override
let lastShownIdx = -2, lastNextIdx = -2;

/* ==========================================================================
 * PERSISTENCE (localStorage): timeline entries + tracker script
 * ========================================================================== */
function loadState() {
  try {
    const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
    if (!raw) return { entries: [], script: null };
    const data = JSON.parse(raw);
    return {
      entries: Array.isArray(data.entries) ? data.entries : [],
      script: typeof data.script === "string" ? data.script : null,
    };
  } catch (e) { return { entries: [], script: null }; }
}

function saveState() {
  try {
    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify({ entries, script: savedScript }));
  } catch (e) {
    alert("Could not save: browser storage is full. Try fewer or smaller images.");
  }
}

/* ==========================================================================
 * TIME HELPERS
 * ========================================================================== */
function fmtTime(ms) {
  ms = Math.max(0, ms);
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  const d = Math.floor((ms % 1000) / 100);
  if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  return m + ":" + String(s).padStart(2, "0") + "." + d;
}

// Accepts "90", "1:30", "1:30.5", "12:05" -> milliseconds (or null)
function parseTimeToMs(v) {
  v = String(v).trim();
  if (!v) return null;
  const parts = v.split(":");
  if (parts.length > 3) return null;
  let ms = 0;
  for (const p of parts) {
    if (p === "" || isNaN(parseFloat(p))) return null;
    ms = ms * 60 + parseFloat(p) * 1000;
  }
  return Math.round(ms);
}

/* ==========================================================================
 * TIMER
 * ========================================================================== */
function elapsedMs() { return running ? performance.now() - startedAt : 0; }

function startTimer() {
  if (running) return;
  running = true;
  startedAt = performance.now();
  document.body.classList.add("in-run"); // hide timeline builder for a bigger viewer
}

// Stop, reset to zero, pause, and clear the displayed timeline image + tracker lines.
function resetTimer() {
  running = false;
  previewIdx = -1;
  lastShownIdx = -2; // force re-render of image + list highlights
  renderListHighlights(-1, -1);
  showImage(null);
  clearTrackerLines();
  document.body.classList.remove("in-run"); // restore timeline builder
}

// Mouse / Space fallback keeps the classic toggle behavior.
function toggleTimer() { if (running) resetTimer(); else startTimer(); }

/* ==========================================================================
 * MECHANIC TRACKER (Lua scripts)
 * Drop a .lua file anywhere in this window to load a script. Contract:
 *   - Top-level code runs once at load time (setup).
 *   - Must define global function onFrame(time, gamepadInput):
 *       time         current raid timer in seconds (float)
 *       gamepadInput true if the Guide/control button was pressed since last call
 *   - Call setLine(i, text) to update line i (1..CONFIG.TRACKER_LINES),
 *     or clearLines() to wipe every line.
 * A script error halts it and is shown in the status line; drop a new .lua
 * file to reload. The last loaded script persists across page loads.
 * ========================================================================== */

const F = window.fengari; // bundled Lua 5.3 (fengari) — its <script> tag sits above this one
let luaL = null;          // active Lua state, nil until a script is installed
let onFrameRef = -1;      // registry reference to the user's onFrame function
let luaReady = false;     // true once install succeeded and onFrame exists
let luaError = "";        // last error message, shown in the status line

const trackerStatusEl = document.getElementById("tracker-status");
const trackerLinesEl = document.getElementById("tracker-lines");
const trackerLineEls = [];
for (let i = 0; i < CONFIG.TRACKER_LINES; i++) {
  const div = document.createElement("div");
  div.className = "tline";
  trackerLinesEl.appendChild(div);
  trackerLineEls.push(div);
}

function updateTrackerStatus() {
  if (!savedScript) {
    trackerStatusEl.textContent = "no script loaded — drop a .lua file anywhere to add one";
    trackerStatusEl.className = "tracker-status";
    return;
  }
  trackerStatusEl.className = luaError ? "tracker-status error" : "tracker-status";
  if (luaError) trackerStatusEl.textContent = "error: " + luaError;
  else if (!luaReady) trackerStatusEl.textContent = "script loaded but not active";
  else trackerStatusEl.textContent = "script active (drop a new .lua file to replace it)";
}

function setTrackerLine(i, text) {
  if (i >= 1 && i <= CONFIG.TRACKER_LINES) trackerLineEls[i - 1].textContent = String(text);
}

function clearTrackerLines() {
  for (const el of trackerLineEls) el.textContent = "";
}

// Read the error message left on top of the stack after a failed call.
function luaPopError(L, fallback) {
  const raw = F.lua.lua_tolstring(L, -1);
  const msg = raw ? String(F.to_jsstring(raw)).trim() : fallback;
  F.lua.lua_pop(L, 1);
  return msg;
}

// Compile and run the top-level chunk of a new script. Returns an error string or null on success.
// Atomic: on any failure the previously installed state (if any) keeps running untouched.
function installLuaScript(src) {
  if (!F || !F.lauxlib) return "the built-in Lua engine failed to load — reload the page";
  const L = F.lauxlib.luaL_newstate();
  F.lualib.luaL_openlibs(L);

  // C callbacks the user script can call. NOTE: fengari invokes them as f(L)
  // with no argument count — read arguments from the stack, return result count.
  F.lua.lua_pushcfunction(L, (L2) => {
    const rawText = F.lua.lua_tolstring(L2, 2);
    setTrackerLine(F.lua.lua_tointeger(L2, 1), rawText ? String(F.to_jsstring(rawText)) : "");
    return 0;
  });
  F.lua.lua_setglobal(L, "setLine");
  F.lua.lua_pushcfunction(L, () => { clearTrackerLines(); return 0; });
  F.lua.lua_setglobal(L, "clearLines");

  const st = F.lauxlib.luaL_loadstring(L, F.to_luastring(src));
  if (st !== F.lua.LUA_OK) {
    return "compile: " + luaPopError(L, "syntax error");
  }
  const rc = F.lua.lua_pcall(L, 0, 0, 0); // run top-level chunk (setup code)
  if (rc !== F.lua.LUA_OK) {
    return "runtime: " + luaPopError(L, "script failed at load");
  }

  const t = F.lua.lua_getglobal(L, "onFrame");
  if (t !== F.lua.LUA_TFUNCTION) {
    F.lua.lua_pop(L, 1);
    return "script must define global function onFrame(time, gamepadInput)";
  }
  // All good — swap the new state in atomically.
  const ref = F.lauxlib.luaL_ref(L, F.lua.LUA_REGISTRYINDEX); // pops the value onto the registry
  luaL = L;
  onFrameRef = ref;
  luaReady = true;
  luaError = "";
  updateTrackerStatus();
  return null;
}

// Called from tick() ~10x/sec while the timer runs.
function tickLua(seconds, gamepadInput) {
  if (!luaReady || !luaL) return;
  const L = luaL;
  F.lua.lua_rawgeti(L, F.lua.LUA_REGISTRYINDEX, onFrameRef); // push onFrame
  F.lua.lua_pushnumber(L, seconds);
  F.lua.lua_pushboolean(L, gamepadInput ? 1 : 0);
  const rc = F.lua.lua_pcall(L, 2, 0, 0);
  if (rc !== F.lua.LUA_OK) {
    luaError = "onFrame: " + luaPopError(L, "script failed");
    luaReady = false; // halt until a new script is dropped in
    updateTrackerStatus();
  }
}

// Entry point for .lua file drops (alerts on failure and keeps the previous script).
function installLuaSource(src, name) {
  const err = installLuaScript(src);
  if (err !== null) {
    alert((name ? "Could not load " + name + ".\n" : "") + err + "\nThe previous script stays loaded.");
    return;
  }
  savedScript = src; // only persist scripts that actually installed
  saveState();
  updateTrackerStatus(); // refresh now that savedScript is set
}

/* ==========================================================================
 * TIMELINE / IMAGE DISPLAY
 * ========================================================================== */
function activeIndex(elapsed) {
  let idx = -1;
  for (let i = 0; i < entries.length; i++) {
    if (entries[i].ms <= elapsed) idx = i; else break;
  }
  return idx;
}

function nextIndex(elapsed) {
  for (let i = 0; i < entries.length; i++) {
    if (entries[i].ms > elapsed) return i;
  }
  return -1;
}

const currentImageEl = document.getElementById("current-image");
const noImageEl = document.getElementById("no-image");

function showImage(entry) {
  if (entry) {
    currentImageEl.src = entry.image;
    currentImageEl.hidden = false;
    noImageEl.style.display = "none";
  } else {
    currentImageEl.hidden = true;
    currentImageEl.removeAttribute("src");
    noImageEl.style.display = "";
  }
}

function tick() {
  const elapsed = elapsedMs();
  const timeEl = document.getElementById("time-display");
  const stateEl = document.getElementById("state-label");
  const nextEl = document.getElementById("next-event");

  timeEl.textContent = fmtTime(elapsed);
  timeEl.classList.toggle("running", running);
  stateEl.textContent = running ? "Running" : "Ready";
  stateEl.classList.toggle("running", running);

  // Next upcoming event countdown
  let idx = -1, nextIdx = -1;
  if (running) {
    idx = activeIndex(elapsed);
    nextIdx = nextIndex(elapsed);
    if (nextIdx >= 0) {
      const inMs = entries[nextIdx].ms - elapsed;
      nextEl.textContent = "Next mechanic at " + fmtTime(entries[nextIdx].ms) + "  (" + fmtTime(inMs) + ")";
    } else {
      nextEl.textContent = "\u00a0";
    }
  } else {
    nextEl.textContent = "\u00a0";
  }

  // Preview override (clicking a thumbnail in the list) — works even while paused
  let previewActive = false;
  if (previewIdx >= 0) {
    if (performance.now() < previewUntil) { idx = previewIdx; previewActive = true; }
    else { previewIdx = -1; renderListHighlights(-1, -1); }
  }

  // Reset/paused -> no image shown (unless previewing a thumbnail)
  const shownIdx = previewActive ? idx : (running ? idx : -1);

  if (shownIdx !== lastShownIdx || nextIdx !== lastNextIdx) {
    showImage(shownIdx >= 0 ? entries[shownIdx] : null);
    renderListHighlights(shownIdx, running ? nextIdx : -1);
    lastShownIdx = shownIdx;
    lastNextIdx = nextIdx;
  }

  // Feed the mechanic tracker script (~10x/sec while running). A Guide/control
  // button press since the last tick is reported as gamepadInput = true.
  const hadInput = inputPulse;
  inputPulse = false;
  if (running && luaReady) tickLua(elapsed / 1000, hadInput);
}

setInterval(tick, 100);

/* ==========================================================================
 * TIMELINE BUILDER UI
 * ========================================================================== */
const entryListEl = document.getElementById("entry-list");
const timeInput = document.getElementById("time-input");
const fileInput = document.getElementById("file-input");
const fileDrop = document.getElementById("file-drop");
const pendingPreview = document.getElementById("pending-preview");
const fileLabel = document.getElementById("file-label");
const formError = document.getElementById("form-error");

function uid() {
  return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
}

function sortEntries() { entries.sort((a, b) => a.ms - b.ms); }

function renderList() {
  entryListEl.innerHTML = "";
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    const li = document.createElement("li");
    li.className = "entry";
    li.dataset.idx = i;

    const img = document.createElement("img");
    img.src = e.image;
    img.title = "Click to preview for 3s";
    img.addEventListener("click", () => {
      previewIdx = i;
      previewUntil = performance.now() + 3000;
    });

    const timeSpan = document.createElement("span");
    timeSpan.className = "entry-time";
    timeSpan.textContent = fmtTime(e.ms);
    timeSpan.title = "Click to edit time";
    timeSpan.addEventListener("click", () => startEditTime(li, e, timeSpan));

    const del = document.createElement("button");
    del.className = "entry-del";
    del.type = "button";
    del.textContent = "\u2715";
    del.title = "Delete entry";
    del.addEventListener("click", () => {
      entries.splice(entries.indexOf(e), 1);
      saveState();
      renderList();
      lastShownIdx = -2; // refresh displayed image if needed
    });

    li.append(img, timeSpan, del);
    entryListEl.appendChild(li);
  }
}

function startEditTime(li, e, span) {
  const input = document.createElement("input");
  input.type = "text";
  input.value = fmtTime(e.ms).replace(/\.\d$/, "");
  span.replaceWith(input);
  input.focus();
  input.select();

  let done = false;
  function commit(ok) {
    if (done) return;
    done = true;
    if (ok) {
      const ms = parseTimeToMs(input.value);
      if (ms !== null && isFinite(ms)) e.ms = ms;
    }
    saveState();
    sortEntries();
    renderList();
    lastShownIdx = -2;
  }
  input.addEventListener("keydown", ev => {
    if (ev.key === "Enter") commit(true);
    else if (ev.key === "Escape") commit(false);
    ev.stopPropagation(); // don't let Space/other keys toggle the timer
  });
  input.addEventListener("blur", () => commit(true));
}

function renderListHighlights(activeIdx, nextIdx) {
  for (const li of entryListEl.children) {
    const i = +li.dataset.idx;
    li.classList.toggle("active", i === activeIdx);
    li.classList.toggle("next", i === nextIdx && i !== activeIdx);
  }
}

// ---- image intake: click, drag & drop, paste ----
async function fileToDataUrl(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error("not an image"));
      im.src = url;
    });
    let w = img.naturalWidth, h = img.naturalHeight;
    if (w > CONFIG.MAX_IMAGE_WIDTH) { h = Math.round(h * CONFIG.MAX_IMAGE_WIDTH / w); w = CONFIG.MAX_IMAGE_WIDTH; }
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    return c.toDataURL("image/jpeg", 0.85);
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function setPendingFile(file) {
  if (!file || !file.type.startsWith("image/")) { formError.textContent = "That is not an image file."; return; }
  try {
    const dataUrl = await fileToDataUrl(file);
    pendingFile = { dataUrl, name: file.name || "pasted image" };
    pendingPreview.src = dataUrl;
    pendingPreview.style.display = "";
    fileLabel.textContent = file.name || "pasted image";
    fileDrop.classList.add("has-file");
    formError.textContent = "";
  } catch (e) {
    formError.textContent = "Could not read that image.";
  }
}

function clearPendingFile() {
  pendingFile = null;
  pendingPreview.style.display = "none";
  fileLabel.textContent = "click / drop / paste image";
  fileDrop.classList.remove("has-file");
  fileInput.value = "";
}

fileDrop.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => setPendingFile(fileInput.files[0]));
fileDrop.addEventListener("dragover", e => { e.preventDefault(); });
fileDrop.addEventListener("drop", e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith("image/")) setPendingFile(f); // non-images fall through to the document import handler
});
document.addEventListener("paste", e => {
  for (const item of e.clipboardData.items) {
    if (item.type.startsWith("image/")) { setPendingFile(item.getAsFile()); break; }
  }
});

document.getElementById("add-form").addEventListener("submit", async e => {
  e.preventDefault();
  formError.textContent = "";
  const ms = parseTimeToMs(timeInput.value);
  if (ms === null || !isFinite(ms) || ms < 0) { formError.textContent = "Enter a time, e.g. 1:30"; return; }
  if (!pendingFile) { formError.textContent = "Add an image first (click / drop / paste)."; return; }
  entries.push({ id: uid(), ms, image: pendingFile.dataUrl });
  sortEntries();
  saveState();
  renderList();
  clearPendingFile();
  timeInput.value = "";
});

document.getElementById("clear-all").addEventListener("click", () => {
  if (!entries.length) return;
  if (confirm("Delete all timeline entries?")) {
    entries = [];
    saveState();
    renderList();
    lastShownIdx = -2;
  }
});

/* ==========================================================================
 * EXPORT / IMPORT TIMELINES (.json files)
 * ========================================================================== */
function isLuaFile(f) {
  if (!f) return false;
  const name = f.name.toLowerCase();
  return name.endsWith(".lua") || f.type === "text/x-lua" || f.type === "application/x-lua";
}

async function importLuaFile(file) {
  let src;
  try { src = await file.text(); }
  catch (e) { alert("Could not read that file."); return; }
  installLuaSource(src, file.name);
}

document.getElementById("export-btn").addEventListener("click", () => {
  if (!entries.length) { alert("Nothing to export — the timeline is empty."); return; }
  const data = {
    app: "ffxiv-raid-companion",
    version: 1,
    exportedAt: new Date().toISOString(),
    entries: entries.map(e => ({ id: e.id, ms: e.ms, image: e.image })),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
  a.href = url;
  a.download = "raid-timeline-" + stamp + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

async function importTimelineFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { alert("That file is not valid JSON."); return; }
  const list = Array.isArray(data) ? data : data.entries;
  if (!Array.isArray(list)) { alert("Not a raid companion timeline file (no entries found)."); return; }

  const cleaned = [];
  for (const e of list) {
    if (!e || typeof e !== "object") continue;
    const ms = Number(e.ms);
    if (!isFinite(ms) || ms < 0) continue;
    if (typeof e.image !== "string" || !(e.image.startsWith("data:") || e.image.startsWith("http"))) continue;
    cleaned.push({ id: typeof e.id === "string" ? e.id : uid(), ms, image: e.image });
  }
  if (!cleaned.length) { alert("No valid timeline entries found in that file."); return; }

  const msg = "Load this timeline (" + cleaned.length + " entries)? It will REPLACE your current timeline" +
    (entries.length ? " (" + entries.length + " entries)" : "") + ".";
  if (!confirm(msg)) return;

  entries = cleaned;
  previewIdx = -1;
  lastShownIdx = -2;
  sortEntries();
  saveState();
  renderList();
}

// Whole window is a drop target for imports (images are still handled by the builder zone):
//   image/*            -> timeline builder intake
//   .json / JSON text  -> replace the timeline
//   .lua / other text  -> load as mechanic tracker script
document.addEventListener("dragover", e => {
  if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault();
});
document.addEventListener("drop", async e => {
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if (!f) return;
  e.preventDefault(); // stop the browser from navigating to dropped files
  if (f.type.startsWith("image/")) return; // #file-drop handles images itself

  if (isLuaFile(f)) { await importLuaFile(f); return; }

  let text = "";
  try { text = (await f.text()).trim(); } catch (err) { /* unreadable */ }
  if (text.startsWith("{") || text.startsWith("[")) await importTimelineFile(f); // JSON-looking -> timeline
  else await importLuaFile(f); // anything else is treated as a Lua script
});

/* ==========================================================================
 * GAMEPAD INPUT
 * Browsers only deliver gamepad input to the focused window/tab. Two paths:
 *   1) Native polling below (works while this window is focused).
 *   2) WebSocket relay (gamepad_relay.py) — works even when FFXIV has focus.
 *
 * Control button semantics: a single press triggers the mechanic tracker and
 * starts a stopped timer; two presses within CONFIG.DOUBLE_PRESS_MS reset it.
 * Only this button reaches the app — every other controller button is used by
 * FFXIV itself, so polling ignores them entirely.
 * ========================================================================== */

let inputPulse = false; // control-button press since the last tick -> Lua's gamepadInput
let lastCtrlPressAt = null; // performance.now() of the previous control-button press (null until first press)

function onControlButtonPress() {
  const now = performance.now();
  if (lastCtrlPressAt !== null && now - lastCtrlPressAt < CONFIG.DOUBLE_PRESS_MS) {
    resetTimer(); // double press -> stop and reset; keeping the timestamp makes a rapid third tap another no-op reset
  } else {
    lastCtrlPressAt = now;
    if (!running) startTimer(); // single press on a stopped timer starts it; while running, just the trigger pulse below
  }
}

function registerButtonEdge(buttonIndex, pressed) {
  if (buttonIndex !== CONFIG.RESET_BUTTON_INDEX) return; // only the Guide button matters here
  inputPulse = true; // visible to the tracker script as gamepadInput
  if (pressed) onControlButtonPress();
}

// ---- native polling with edge detection on the control button only ----
const gpPrevStates = new Map(); // gamepad index -> last seen state of the control button
let interacted = false; // browsers gate getGamepads() behind a user gesture
addEventListener("click", () => interacted = true, { once: false });
addEventListener("keydown", () => interacted = true, { once: false });

function pollGamepad() {
  if (relayRecentlyActive()) return; // relay is authoritative to avoid double-firing
  let connected = false;
  try {
    const pads = navigator.getGamepads ? Array.from(navigator.getGamepads()) : [];
    for (let gi = 0; gi < pads.length; gi++) {
      const gp = pads[gi];
      if (!gp || !gp.connected) continue;
      connected = true;
      const b = gp.buttons[CONFIG.RESET_BUTTON_INDEX];
      const p = !!(b && b.pressed);
      // rising edge only: a held button must not re-trigger the tracker every tick
      if (interacted && p && !gpPrevStates.get(gi)) registerButtonEdge(CONFIG.RESET_BUTTON_INDEX, true);
      gpPrevStates.set(gi, p);
    }
  } catch (e) { /* getGamepads unavailable */ }
  updateGpStatus(connected);
}
setInterval(pollGamepad, 50);

// ---- mouse / keyboard fallbacks (when page is focused) ----
document.getElementById("toggle-btn").addEventListener("click", toggleTimer);
addEventListener("keydown", e => {
  const t = document.activeElement;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  if (e.code === "Space") { e.preventDefault(); toggleTimer(); }
});

let gpStatusShown = null;
function updateGpStatus(connected) {
  const key = connected ? "on" : "off";
  if (key === gpStatusShown) return;
  gpStatusShown = key;
  document.getElementById("gp-dot").className = "dot " + (connected ? "on" : "off");
  document.getElementById("gp-status").textContent = "gamepad: " + (connected ? "connected" : "disconnected");
}

/* ---- WebSocket relay client ---- */
let ws = null, relayLastMsgAt = 0;
function relayRecentlyActive() { return Date.now() - relayLastMsgAt < 1500; }

let relayStatusShown = "";
function setRelayState(state) { // "connected" | "offline" | "disabled"
  if (state === relayStatusShown) return;
  relayStatusShown = state;
  const dot = document.getElementById("relay-dot");
  const label = document.getElementById("relay-status");
  dot.className = "dot " + (state === "connected" ? "on" : state === "offline" ? "off" : "");
  label.textContent = "relay: " + state;
}

function connectRelay() {
  if (!CONFIG.RELAY_WS_URL) { setRelayState("disabled"); return; }
  try { ws = new WebSocket(CONFIG.RELAY_WS_URL); } catch (e) { scheduleRelayReconnect(); return; }
  ws.onopen = () => setRelayState("connected");
  ws.onmessage = e => {
    try {
      const m = JSON.parse(e.data);
      relayLastMsgAt = Date.now(); // any traffic marks the relay as authoritative
      if (m.pressed && typeof m.button === "number") registerButtonEdge(m.button, true);
    } catch (err) { /* ignore malformed frames */ }
  };
  ws.onclose = () => { setRelayState("offline"); scheduleRelayReconnect(); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
function scheduleRelayReconnect() { setTimeout(connectRelay, 2000); }

/* ==========================================================================
 * INIT
 * ========================================================================== */
const ctrlBtnName = BUTTON_NAMES[CONFIG.RESET_BUTTON_INDEX] || ("btn " + CONFIG.RESET_BUTTON_INDEX);
document.getElementById("bind-status").textContent = "control button: " + ctrlBtnName;
document.getElementById("hint").innerHTML =
  "<b>" + ctrlBtnName + "</b>: single press triggers the tracker (starts a stopped timer), double press resets.<br>" +
  "Drop images on the builder, .json timelines and .lua scripts anywhere.";
sortEntries();
renderList();
if (savedScript) installLuaScript(savedScript); // persisted tracker script; any error shows in the status line
else updateTrackerStatus();
tick();
connectRelay();
</script>
</body>
</html>
